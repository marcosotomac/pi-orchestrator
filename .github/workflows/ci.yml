name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:installer
# Live smoke/benchmark scripts deliberately have no workflow: they require explicit
# operator approval, provider credentials and a quota budget. Never run on PRs.
